[versions]
agp = "8.11.1"
constraintlayout = "2.2.1"
core = "13.0.0"
coreSplashscreen = "1.0.1"
firebaseBom = "34.3.0"
glide = "5.0.4"
kotlin = "2.2.10"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
